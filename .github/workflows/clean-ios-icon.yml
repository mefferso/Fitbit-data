name: Clean iPhone Home Screen icon

on:
  push:
    paths:
      - '.github/workflows/clean-ios-icon.yml'
      - 'scripts/clean_ios_icon.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  clean-icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pillow
      - run: python scripts/clean_ios_icon.py
      - name: Commit corrected icon
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/v2/apple-touch-icon.png
          if ! git diff --cached --quiet; then
            git commit -m "Fix white fringes on iOS Home Screen icon"
            git push
          fi
