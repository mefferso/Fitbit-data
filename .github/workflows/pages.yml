name: Publish real workout dashboard

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build sanitized real-data export
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TEMPEST_API_TOKEN: ${{ secrets.TEMPEST_API_TOKEN }}
          TEMPEST_STATION_ID: ${{ secrets.TEMPEST_STATION_ID }}
        run: |
          node scripts/build-public-data.mjs

      - name: Validate export
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("docs/data.json")
          data = json.loads(p.read_text())
          if data.get("error"):
              raise SystemExit(f"Export returned error: {data['error']}")
          if "recentRuns" not in data or "detailedRuns" not in data:
              raise SystemExit("Export is missing expected workout fields")
          latest = json.loads(Path("docs/data/latest.json").read_text())
          index = json.loads(Path("docs/data/run-index.json").read_text())
          trends = json.loads(Path("docs/data/trends.json").read_text())
          if not isinstance(index.get("runs"), list):
              raise SystemExit("Permanent run index is missing runs")
          if data.get("detailedRuns") and not latest.get("run"):
              raise SystemExit("Latest-run feed is missing detailed run data")
          if "runningTrend" not in trends:
              raise SystemExit("Trend feed is missing runningTrend")
          print(f"Validated {len(data.get('recentRuns', []))} recent runs, {len(data.get('detailedRuns', []))} dashboard details, and {len(index.get('runs', []))} indexed runs")
          PY

      - name: Commit sanitized run data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data
          if git diff --cached --quiet; then
            echo "No workout-data changes to commit."
          else
            git commit -m "Update sanitized workout data [skip ci]"
            git push origin HEAD:main
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
