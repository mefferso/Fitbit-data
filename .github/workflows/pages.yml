name: Publish Garmin-first Performance Lab

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/v2/**"
      - "scripts/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Garmin FIT importer
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Garmin's official Personal API client and FIT parser
        run: python -m pip install garmin-connect-personal-api-python fitparse

      - name: Syntax validation
        run: |
          python -m py_compile scripts/stage-garmin-runs.py scripts/sync-garmin.py scripts/garmin_hrv.py scripts/garmin_hrv_fit.py scripts/collect-daytime-hrv.py
          node --check scripts/publish-garmin.mjs
          node --check docs/v2/js/daytime-hrv.mjs
          node --input-type=module --check < docs/v2/js/experiments.js

      - name: Test Garmin and Performance Lab
        run: |
          python -m unittest discover -s tests
          node --test tests/*.test.mjs

      - name: Sync Garmin running and owner-approved public wellness
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
          GARMIN_PUBLISH_HEALTH_SNAPSHOTS: ${{ vars.GARMIN_PUBLISH_HEALTH_SNAPSHOTS }}
        run: python scripts/sync-garmin.py --since 2026-11-16 --wellness-days 3

      - name: Publish Garmin data independently of Google Health
        env:
          TEMPEST_API_TOKEN: ${{ secrets.TEMPEST_API_TOKEN }}
          TEMPEST_STATION_ID: ${{ secrets.TEMPEST_STATION_ID }}
          # Running zones as displayed Nov 17, 2026: %Max HR (186), 50/60/70/80/90%.
          # Rounded BPM boundaries from displayed percentages; revise if Garmin shows exact BPM.
          GARMIN_RUNNING_HR_ZONE_STARTS_BPM: "93,112,130,149,167"
        run: node scripts/publish-garmin.mjs

      - name: Validate source integrity, schema and safe API handling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          index=json.loads(Path("docs/data/run-index.json").read_text())
          latest=json.loads(Path("docs/data/latest.json").read_text())
          wellness=json.loads(Path("docs/data/garmin-wellness.json").read_text())
          runs=index.get("runs",[])
          if len({r["runId"] for r in runs}) != len(runs):
              raise SystemExit("Duplicate canonical run IDs")
          current=[r for r in runs if r.get("date","") >= "2026-11-16"]
          if not all(r.get("source") == "garmin" for r in current):
              raise SystemExit("Non-Garmin running data after cutover")
          ids=[r.get("sourceActivityId") for r in current]
          if len(set(ids)) != len(ids):
              raise SystemExit("Duplicate Garmin activity IDs")
          if current and latest.get("run",{}).get("source") != "garmin":
              raise SystemExit("Latest run not Garmin-authoritative")
          if not isinstance(wellness.get("days"),dict):
              raise SystemExit("Garmin wellness feed malformed")
          forbidden=('position_lat','position_long','latitude','longitude',
                     'access_token','refresh_token','bearer ','api_key')
          for r in current:
              file=Path('docs')/r['detailFile']
              detail=json.loads(file.read_text())
              if detail.get('sourceActivityId')!=r['sourceActivityId']:
                  raise SystemExit("Garmin run/detail mismatch")
              if any(token in file.read_text().lower() for token in forbidden):
                  raise SystemExit("Sensitive FIT position/secret-like key leaked")
          if any(token in json.dumps(wellness).lower() for token in forbidden):
              raise SystemExit("Sensitive wellness location/credential-like key leaked")
          print(f"Validated {len(runs)} runs, {len(current)} Garmin-era runs, "+
                f"{len(wellness['days'])} wellness dates")
          PY

      - name: Commit Garmin data only when it actually changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/data
          if git diff --cached --quiet; then
            echo "Garmin feed is unchanged."
          else
            git commit -m "Update Garmin runs and wellness [skip ci]"
            pushed=false
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase -X theirs origin/main
              if git push origin HEAD:main; then
                pushed=true
                break
              fi
              sleep 2
            done
            if [ "$pushed" != true ]; then
              echo "Unable to publish sanitized Garmin export after safe retries." >&2
              exit 1
            fi
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # Artifact availability can lag behind upload success. Wait for GitHub's
      # artifact API to index the upload before deploy-pages requests it.
      - name: Wait for Pages artifact to become discoverable
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
        run: |
          sleep 10
          for attempt in 1 2 3 4 5 6; do
            count=$(gh api "repos/$GH_REPO/actions/runs/$GH_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            echo "Pages artifact visibility (attempt $attempt): $count"
            if [ "$count" -gt 0 ]; then
              exit 0
            fi
            sleep 10
          done
          echo "Pages artifact still unavailable in GitHub Actions API" >&2
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
