name: Stage Garmin running data (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Garmin client and FIT parser
        run: python -m pip install garmin-connect-personal-api-python fitparse
      - name: Audit latest Garmin running data without publishing it
        env:
          GARMIN_PERSONAL_API_KEY: ${{ secrets.GARMIN_PERSONAL_API_KEY }}
        run: python scripts/stage-garmin-runs.py --limit 20
