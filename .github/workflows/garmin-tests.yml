name: Garmin-first integration checks
on:
  pull_request:
    paths:
      - 'scripts/sync-garmin.py'
      - 'scripts/stage-garmin-runs.py'
      - 'scripts/publish-garmin.mjs'
      - 'scripts/garmin-analysis.mjs'
      - 'scripts/garmin-recovery.mjs'
      - 'docs/v2/**'
      - 'tests/garmin-first.test.mjs'
      - 'tests/garmin-analysis.test.mjs'
      - 'tests/garmin-recovery.test.mjs'
      - '.github/workflows/garmin-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-garmin.py'
      - 'scripts/stage-garmin-runs.py'
      - 'scripts/publish-garmin.mjs'
      - 'docs/v2/**'
      - 'tests/garmin-first.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python syntax
        run: python -m py_compile scripts/stage-garmin-runs.py scripts/sync-garmin.py
      - name: Validate JavaScript syntax
        run: |
          node --check scripts/publish-garmin.mjs
          node --check scripts/garmin-analysis.mjs
          node --check scripts/garmin-recovery.mjs
          node --check docs/v2/js/app.js
          node --check docs/v2/js/garmin-lab.js
      - name: Run Garmin and existing analytics tests
        run: node --test tests/garmin-first.test.mjs tests/garmin-analysis.test.mjs tests/garmin-recovery.test.mjs tests/aerobic-analysis.test.mjs tests/run-comparison.test.mjs
